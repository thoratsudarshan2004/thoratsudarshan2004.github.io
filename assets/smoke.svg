<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <filter id="plume" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.021" numOctaves="5" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="150" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffb37a" stop-opacity="0.95"/>
      <stop offset="28%"  stop-color="#fc6b2f" stop-opacity="0.75"/>
      <stop offset="62%"  stop-color="#b8342b" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#a02a22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wisp" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fc6b2f" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#a02a22" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a02a22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#plume)">
    <ellipse cx="400" cy="205" rx="215" ry="105" fill="url(#core)"/>
    <ellipse cx="292" cy="168" rx="128" ry="82"  fill="url(#wisp)"/>
    <ellipse cx="512" cy="236" rx="150" ry="74"  fill="url(#wisp)"/>
    <ellipse cx="398" cy="118" rx="96"  ry="54"  fill="url(#wisp)"/>
    <ellipse cx="455" cy="300" rx="110" ry="48"  fill="url(#wisp)"/>
  </g>
</svg>
